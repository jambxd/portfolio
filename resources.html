<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jam Abad | Free Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   COLORS, FONTS & BASE
   ========================================================== */
:root {
  --accent: #6b1010;
  --accent-ink: #ffffff;
  --bg: #fbfaf8;≈
  --surface: #ffffff;
  --tint: #f3ecec;
  --ink: #1c1618;
  --muted: #665c60;
  --line: #e4dcdd;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

html {
  scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.65 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}

a {
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px;
}


/* ==========================================================
   NAVIGATION
   ========================================================== */
header {
  position: sticky;
  top: env(safe-area-inset-top, 10px);
  z-index: 11;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  gap: 16px;
}

.logo {
  font: 700 1.15rem var(--display);
  text-decoration: none;
  letter-spacing: -0.01em;
}

.logo span {
  color: var(--accent);
}

nav ul {
  display: flex;
  gap: 26px;
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 0.95rem;
  font-weight: 500;
}

nav a {
  text-decoration: none;
  color: var(--muted);
}

nav a:hover {
  color: var(--accent);
}

nav a.res {
  color: var(--accent);
  font-weight: 600;
}

.nav-btn {
  padding: 10px 22px;
  font-size: 0.95rem;
  flex: none;
}

@media (max-width: 720px) {
  nav ul {
    display: none;
  }
}


/* ==========================================================
   BUTTONS
   ========================================================== */
.btn {
  display: inline-block;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 14px 26px;
  border-radius: 999px;
  font-weight: 600;
  text-decoration: none;
  border: 2px solid var(--accent);
  transition: background 0.15s, color 0.15s;
}

.btn:hover {
  background: transparent;
  color: var(--accent);
}


/* ==========================================================
   PAGE CONTENT
   ========================================================== */
main {
  flex: 1;
}

section {
  padding: 84px 0;
}

h1 {
  font: 700 clamp(2.2rem, 5vw, 3.6rem)/1.05 var(--display);
  letter-spacing: -0.03em;
  color: var(--accent);
  margin: 0 0 28px;
}

.soon {
  background: var(--tint);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 48px 40px;
  max-width: 640px;
}

.soon p {
  font-size: 1.25rem;
  margin: 0 0 28px;
}


/* ==========================================================
   FOOTER
   ========================================================== */
footer {
  border-top: 1px solid var(--line);
  padding: 36px 0 48px;
  color: var(--muted);
  font-size: 0.92rem;
}

.foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 20px;
}

footer ul {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  list-style: none;
  margin: 0;
  padding: 0;
}

footer a {
  text-decoration: none;
}

footer a:hover {
  color: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html"><span>Jam Abad</span></a>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html#top">About</a></li>
        <li><a href="index.html#press">Work</a></li>
        <li><a href="index.html#praise">Testimonial</a></li>
        <li><a class="res" href="resources.html" aria-current="page">Free Resources</a></li>
      </ul>
    </nav>
    <a class="btn nav-btn" href="index.html#contact">Work with me</a>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <h1>Free Resources</h1>
      <div class="soon">
        <p>Still working on free templates you can use. Come back later.</p>
        <a class="btn" href="index.html">Back to home</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span>© 2026 Jam Abad. All rights reserved.</span>
    <ul>
      <li><a href="https://www.linkedin.com/in/abadjm/" target="_blank">LinkedIn</a></li>
      <li><a href="https://scaleshift.substack.com/?utm_campaign=profile_chips" target="_blank">Newsletter</a></li>
      <li><a href="resources.html">Free Resources</a></li>
    </ul>
  </div>
</footer>

</body>
</html>
